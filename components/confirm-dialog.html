<!--
  Reusable confirmation dialog pattern derived from htmlapps-template.
  Reference API: await AppConfirm.ask({ title, message, confirmLabel, cancelLabel, tone })
-->
<style>
  .app-confirm-dialog{width:min(420px,calc(100% - 24px));max-width:100%;padding:0;overflow:hidden;border:1px solid var(--line,#dadbd6);border-radius:17px;background:var(--surface,#fff);color:var(--text,#20211f);box-shadow:var(--shadow-md,0 12px 34px rgba(25,28,24,.1))}
  .app-confirm-dialog::backdrop{background:rgba(15,17,14,.48);backdrop-filter:blur(3px)}
  .app-confirm-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px 13px;border-bottom:1px solid var(--line,#dadbd6)}
  .app-confirm-title{margin:0;font-size:17px}.app-confirm-close{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer}.app-confirm-close:hover{background:var(--surface-hover,#e9e9e5)}
  .app-confirm-body{padding:18px}.app-confirm-message{margin:0;color:var(--muted,#666963);font-size:13px;line-height:1.7;overflow-wrap:anywhere}.app-confirm-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}
  .app-confirm-button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border:1px solid var(--line,#dadbd6);border-radius:11px;background:var(--surface,#fff);color:inherit;font:inherit;font-size:12px;font-weight:760;cursor:pointer}.app-confirm-button.primary{border-color:var(--accent,#16624f);background:var(--accent,#16624f);color:#fff}.app-confirm-button.danger{border-color:var(--danger,#b3261e);background:var(--danger,#b3261e);color:#fff}
  @media(max-width:520px){.app-confirm-dialog{width:100%;max-width:none;margin:auto 0 0;border-width:1px 0 0;border-radius:22px 22px 0 0}.app-confirm-dialog::backdrop{background:rgba(0,0,0,.42);backdrop-filter:blur(2px)}.app-confirm-header{padding:14px 18px 12px}.app-confirm-body{padding:12px 18px calc(env(safe-area-inset-bottom) + 18px)}.app-confirm-message{font-size:14px;line-height:1.75}.app-confirm-actions{grid-template-columns:1fr;gap:10px;margin-top:16px}.app-confirm-button{min-height:48px;font-size:14px}}
</style>
<dialog class="app-confirm-dialog" id="appConfirmDialog" aria-labelledby="appConfirmTitle" aria-describedby="appConfirmMessage">
  <div class="app-confirm-header"><h2 class="app-confirm-title" id="appConfirmTitle">Confirm</h2><button class="app-confirm-close" id="appConfirmClose" type="button" aria-label="Close">×</button></div>
  <div class="app-confirm-body"><p class="app-confirm-message" id="appConfirmMessage"></p><div class="app-confirm-actions"><button class="app-confirm-button" id="appConfirmCancel" type="button">Cancel</button><button class="app-confirm-button primary" id="appConfirmOk" type="button">OK</button></div></div>
</dialog>
<script>
(()=>{'use strict';const dialog=document.getElementById('appConfirmDialog'),title=document.getElementById('appConfirmTitle'),message=document.getElementById('appConfirmMessage'),closeButton=document.getElementById('appConfirmClose'),cancelButton=document.getElementById('appConfirmCancel'),okButton=document.getElementById('appConfirmOk');let resolver=null,restoreFocus=null;const finish=result=>{if(!dialog.open)return;const done=resolver;resolver=null;dialog.close();if(restoreFocus instanceof HTMLElement&&restoreFocus.isConnected)restoreFocus.focus({preventScroll:true});restoreFocus=null;if(done)done(result)};const ask=(options={})=>{if(dialog.open)finish(false);title.textContent=options.title||'Confirm';message.textContent=options.message||'';cancelButton.textContent=options.cancelLabel||'Cancel';okButton.textContent=options.confirmLabel||'Continue';okButton.classList.toggle('danger',options.tone==='danger');okButton.classList.toggle('primary',options.tone!=='danger');restoreFocus=document.activeElement;return new Promise(resolve=>{resolver=resolve;dialog.showModal();requestAnimationFrame(()=>cancelButton.focus({preventScroll:true}))})};closeButton.addEventListener('click',()=>finish(false));cancelButton.addEventListener('click',()=>finish(false));okButton.addEventListener('click',()=>finish(true));dialog.addEventListener('cancel',event=>{event.preventDefault();finish(false)});window.AppConfirm=Object.freeze({ask})})();
</script>
