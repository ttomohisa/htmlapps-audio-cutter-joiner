name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and verify
        shell: pwsh
        run: .\scripts\check-repository.ps1

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: audio-cutter-joiner-${{ github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/build-size-report.json
            dist/self-extract-manifest.json
            dist/.nojekyll
            audio-cutter-joiner.html
          if-no-files-found: error
          retention-days: 14

  publish_release:
    # This existing main-push workflow also handles the PR that first adds release automation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: audio-cutter-joiner-release
      cancel-in-progress: false
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified standalone files
        uses: actions/download-artifact@v4
        with:
          name: audio-cutter-joiner-${{ github.sha }}
          path: release-assets

      - name: Create version tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("app.config.json"))["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          tag="v${version}"
          git fetch --tags origin
          if ! git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          test -s "release-assets/audio-cutter-joiner.html"
          test -s "release-assets/dist/index.self-extract.html"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              "release-assets/audio-cutter-joiner.html" \
              "release-assets/dist/index.self-extract.html" \
              --verify-tag --title "$tag" --generate-notes
          else
            echo "GitHub Release $tag already exists; leaving it unchanged."
          fi
