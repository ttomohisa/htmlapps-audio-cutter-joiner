name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and verify
        shell: pwsh
        run: .\scripts\check-repository.ps1

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: audio-cutter-joiner-${{ github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/build-size-report.json
            dist/self-extract-manifest.json
            dist/.nojekyll
            audio-cutter-joiner.html
          if-no-files-found: error
          retention-days: 14
