name: Release on merged PR

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: audio-cutter-joiner-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and build standalone files
        shell: pwsh
        run: .\scripts\check-repository.ps1

      - name: Create version tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content app.config.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid SemVer version: $version" }
          $tag = "v$version"
          git fetch --tags origin
          git rev-parse -q --verify "refs/tags/$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists. Not moving an existing release tag."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin "refs/tags/$tag"
          gh release create $tag --verify-tag --title $tag --generate-notes
